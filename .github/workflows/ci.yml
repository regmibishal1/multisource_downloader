name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the public check reads this PR's commit messages
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install ".[all,dev]"
      - name: Public repository check
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python scripts/check_public.py --commits "origin/${{ github.base_ref }}..HEAD"
          else
            python scripts/check_public.py
          fi
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py" -v

  windows-app:
    # brief Q2: build the Windows app and check the frozen build itself
    name: Windows app build and self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install ".[all]" pyinstaller
      - name: Build
        run: python scripts/build_exe.py
      - name: Self-test the built app
        shell: pwsh
        run: |
          $exe = "dist\MultisourceDownloader\MultisourceDownloader.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "--report", "self-test.txt" -Wait -PassThru
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: MultisourceDownloader-windows
          path: dist/MultisourceDownloader-*-windows.zip
          retention-days: 14
