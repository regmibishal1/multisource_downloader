[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multisource-downloader"
dynamic = ["version"]
description = "Download media and metadata from links on YouTube, X, Instagram, TikTok, Threads, Facebook, Reddit and Google Drive."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # 2025.11.12 and later support YouTube's JavaScript challenges; the
    # [default] extra brings yt-dlp-ejs, which they need.
    "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
# 4.15.3 fixed reading posts after an Instagram change
instagram = ["instaloader>=4.15.3"]
# Drive sign-in with Google cookies needs gdown 6 (cookies_file); public
# links work with 5 too.
# Drive with your own Google Cloud OAuth client uses Google's own libraries.
drive = ["gdown>=5", "google-auth>=2.15", "google-auth-oauthlib>=1.0"]
# "Sign in here": the platform's own sign-in page in a small app window.
webview = ["pywebview>=5"]
# Image posts (photo-only X posts, carousels, Bluesky). gallery-dl is GPL-2.0;
# the app only runs it as a separate program and never imports it.
images = ["gallery-dl>=1.26"]
all = ["multisource-downloader[instagram,drive,webview,images]"]
dev = ["ruff>=0.6"]

[project.scripts]
msdl = "multidownloader.cli:main"
multidownloader-batch = "multidownloader.batch:main"
multidownloader-signin = "multidownloader.signin_cli:main"

[project.gui-scripts]
multisource-downloader = "multisource_downloader_ui:main"

[project.urls]
Source = "https://github.com/regmibishal1/multisource-downloader"
Issues = "https://github.com/regmibishal1/multisource-downloader/issues"

[tool.hatch.version]
path = "multidownloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["multidownloader"]

[tool.hatch.build.targets.wheel.force-include]
"multisource_downloader_ui.py" = "multisource_downloader_ui.py"

[tool.hatch.build.targets.sdist]
exclude = ["penv", "build", "dist"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["penv"]

[tool.ruff.lint]
# pyflakes plus pycodestyle errors; style rules can be tightened later
select = ["E4", "E7", "E9", "F"]
